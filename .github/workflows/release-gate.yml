name: Release gate

# Deep run of the #73 property matrix and mutation gate at 10x the example budget.
# It lives in its own workflow so that (a) a scheduled run does not also launch the
# ordinary five-version suite, and (b) its concurrency group is separate from CI's,
# so a push to main can neither cancel a running gate nor be cancelled by one.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true  # a newer gate supersedes an older one of the same kind

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Property matrix and mutation gate (TSR_MATRIX_SCALE=10)
        env:
          TSR_MATRIX_SCALE: "10"
        run: |
          uv run pytest -v \
            tests/tsr/hands/test_grasp_matrix.py \
            tests/tsr/hands/test_grasp_mutation_gate.py \
            tests/tsr/placement/
