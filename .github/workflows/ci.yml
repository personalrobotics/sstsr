name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest tests/ -v

  # The C++ core (#165). Separate from `test` because it needs a compiler rather than a
  # Python matrix, and because what it proves is different: that the second
  # implementation still answers what the Python answers, and that both packagings of the
  # CMake package are usable from outside the build tree.
  cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both toolchains a consumer builds with: libstdc++ and libc++. The region is
        # standard-library only, so the standard library is the variable that matters.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Configure and build
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j

      # Includes the conformance corpus: the C++ against the Python's recorded answers.
      - name: ctest
        run: ctest --test-dir build --output-on-failure

      # The corpus has to be current, or the C++ is being checked against stale answers.
      - name: The corpus matches what the Python answers today
        run: |
          uv sync --all-extras --dev
          uv run python tools/tsr_conformance.py --check

      - name: A consumer can use the installed CMake package
        run: ./cpp/examples/consumer/smoke.sh

      - name: A consumer can use the CMake package inside a wheel
        run: ./cpp/examples/wheel_consumer/smoke.sh

  notify-robot-code:
    needs: [test, cpp]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Surface the token to step-level `if` (the `secrets` context isn't available
    # in `if` directly). When it's unset, skip the dispatch with a visible notice
    # rather than failing an otherwise-green run (#56). A real dispatch failure
    # with a configured token still surfaces.
    env:
      DISPATCH_TOKEN: ${{ secrets.ROBOT_CODE_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch integration run
        if: env.DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ env.DISPATCH_TOKEN }}
          repository: personalrobotics/robot-code
          event-type: sibling-updated
          client-payload: '{"repo":"${{ github.event.repository.name }}","sha":"${{ github.sha }}"}'
      - name: Skip downstream dispatch (no token configured)
        if: env.DISPATCH_TOKEN == ''
        run: echo "::notice::ROBOT_CODE_DISPATCH_TOKEN not configured; skipping downstream dispatch. Package checks passed."
